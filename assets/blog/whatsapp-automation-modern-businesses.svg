  <text x="576" y="246" font-size="16.5" fill="#fff" fill-opacity=".92">Is my order ready?</text>
  <rect x="458" y="278" width="260" height="72" rx="16" fill="#14C9B8" fill-opacity=".18" stroke="#14C9B8" stroke-opacity=".4"/>
  <text x="474" y="310" font-size="16.5" fill="#fff" fill-opacity=".92">Yes! It ships today and</text>
  <text x="474" y="336" font-size="16.5" fill="#fff" fill-opacity=".92">arrives on Thursday.</text>
  <rect x="458" y="368" width="260" height="72" rx="16" fill="#14C9B8" fill-opacity=".18" stroke="#14C9B8" stroke-opacity=".4"/>
  <text x="474" y="400" font-size="16.5" fill="#fff" fill-opacity=".92">Want delivery updates</text>
  <text x="474" y="426" font-size="16.5" fill="#fff" fill-opacity=".92">here on WhatsApp?</text>
  <rect x="458" y="456" width="124" height="40" rx="20" fill="none" stroke="#39FF14" stroke-opacity=".7"/><text x="520" y="482" text-anchor="middle" font-size="16" font-weight="600" fill="#39FF14">Yes please</text>
  <rect x="594" y="456" width="124" height="40" rx="20" fill="none" stroke="#fff" stroke-opacity=".3"/><text x="656" y="482" text-anchor="middle" font-size="16" font-weight="600" fill="#fff" fill-opacity=".8">Not now</text>
  <rect x="600" y="516" width="140" height="46" rx="16" fill="#fff" fill-opacity=".09"/>
  <text x="616" y="548" font-size="16.5" fill="#fff" fill-opacity=".92">Yes please ✓✓</text>
  <rect x="446" y="610" width="308" height="50" rx="25" fill="#fff" fill-opacity=".06"/><text x="470" y="641" font-size="15" fill="#fff" fill-opacity=".4">Message</text>
  <rect x="110" y="190" width="270" height="120" rx="22" fill="url(#panel)" stroke="#fff" stroke-opacity=".12" filter="url(#sh)"/>
  <circle cx="160" cy="250" r="26" fill="url(#grad)"/>
  <g transform="translate(147.4 237.4) scale(1.05)" fill="none" stroke="#04110f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></g>
  <text x="200" y="244" font-size="18" font-weight="600" fill="#fff">Order confirmed</text>
  <text x="200" y="270" font-size="15" fill="#fff" fill-opacity=".55">Sent automatically</text>
  <rect x="820" y="390" width="280" height="120" rx="22" fill="url(#panel)" stroke="#fff" stroke-opacity=".12" filter="url(#sh)"/>
  <circle cx="870" cy="450" r="26" fill="url(#grad)"/>
  <g transform="translate(857.4 437.4) scale(1.05)" fill="none" stroke="#04110f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></g>
  <text x="910" y="444" font-size="18" font-weight="600" fill="#fff">Booking reminder</text>
